; ==============================================================================
; SPECIAL ATTACK PAYLOAD PARAMETERS
; ==============================================================================
; Parameters passed inside animation annotations: Val_SpecialAtkStart.DamageMult(1.0)|PoiseBreaksBlock(false or 0)|...
; All keys are case-insensitive.

;Parry				: Activates parry timing
;Dodge				: Activates dodge timing

;DamageMult			: Multiplier for outgoing damage (Default: 1.0)
;StaggerMult        : Multiplier for poise damage (Default: 1.0)
;StaminaMult        : Multiplier for stamina cost (Default: 1.0)
;FixedDamage        : Sets an absolute damage value, ignoring weapon stats
;FixedStamina       : Sets an absolute stamina cost value
;Stagger			: Applies stagger on hit while dealing no poise damage (1: small, 2: medium, 3: large, 4: largest)

;FailDamageMult     : Damage multiplier applied if the parry/timed action fails (Default: 1.0)
;FailStaggerMult    : Stagger multiplier applied if the parry/timed action fails (Default: 1.0)
;Timing             : Duration in seconds of the active parry/timed action window (Default: 0.3)

;PoiseBreaksBlock   : Set to true to force this attack to deal poise damage through enemy block (Default: false)
;Continue           : Set to true to keep special attack state active across mco exit events (Default: false)
;iFrames            : Grants invincibility frames during the parry/timed action window (Default: true)

;ParrySFX           : Plays the parry sound effect on success (Default: Parry Settings)
;DodgeSFX           : Plays the dodge sound effect on execution (Default: false)
;ScreenShake        : Triggers screen shake on successful impact (Default: Parry Settings)
;ParryVFX           : Spark effect ID to play on successful parry (Default: Parry Settings)
;SlowTime           : Slows time down on successful parry/dodge (Default: Parry Settings)
;SlowTimeDuration   : Time dilation duration in seconds (Default: Parry Settings)
;SlowTimePercentage : Game speed scale during slowtime (Default: Parry Settings)

;Recoil              : Triggers attacker recoil on successful parry/timed action (Default: true)
;Followup            : Triggers a followup or parry followup spell on succesfull hit (Default: true)
;ParrySpell          : Triggers a spell on succesfull parry on the defender (Default: false)

; ==============================================================================
; HYPER ARMOR PAYLOAD PARAMETERS
; ==============================================================================
; Parameters passed inside animation annotations: Val_HyperArmorStart.DamageMult(0.5)|StaggerMult(0.0)|...
; Active from Val_HyperArmorStart until Val_HyperArmorStop or duration expiration.
; All keys are case-insensitive.

;DamageMult          : Multiplier for incoming damage taken while active (Default: 1.0)
;StaggerMult         : Multiplier for incoming poise damage taken while active (Default: 0.0)
;VFX                 : Applies the hyper armor visual effect (Default: true)
;Duration            : Duration in seconds before hyper armor automatically expires (Default: None)


; ==============================================================================
; INVULNERABILITY PAYLOAD PARAMETERS
; ==============================================================================
; Parameters passed inside animation annotations: Val_InvulStart.Duration(0.2)
; Active from Val_InvulStart until Val_InvulStop or duration expiration.
; Completely negates all incoming melee hits and projectile collisions.
; All keys are case-insensitive.

;Duration            : Duration in seconds before invulnerability automatically expires (Default: None)

; ==============================================================================
; ACTION ON HIT PAYLOAD PARAMETERS (This does not work for the preset system)
; ==============================================================================
; Parameters passed inside animation annotations: Val_ActionOnHitStart.RightAttack
; Active from Val_ActionOnHitStart until Val_ActionOnHitStop.
; Triggers attack or power attack on successful hit.

;RightAttack		: The followup attack is a normal right attack
;RightPowerAttack	: The followup attack is a power right attack
